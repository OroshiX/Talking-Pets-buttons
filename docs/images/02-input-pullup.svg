<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Etape 2 - Fonctionnement de INPUT_PULLUP</title>
  <desc id="desc">Schema montrant la resistance pull-up interne entre 3V3 et D2, et le bouton vers GND.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 3; rx: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 22px Arial, sans-serif; fill: #0f172a; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .wire-signal { stroke: #2563eb; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #111827; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wire-3v3 { stroke: #f97316; stroke-width: 8; fill: none; stroke-linecap: round; }
      .res { fill: #ffedd5; stroke: #f97316; stroke-width: 3; }
      .terminal { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .switch { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; fill: none; }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="70" class="label">Etape 2 - INPUT_PULLUP</text>
  <text x="60" y="108" class="small">La resistance orange est interne au GIGA. Tu ne la cables pas.</text>

  <rect x="70" y="160" width="470" height="450" class="panel"/>
  <text x="125" y="210" class="label">Interieur du GIGA</text>
  <text x="130" y="270" class="text">3V3</text>
  <path d="M190 275 V330" class="wire-3v3"/>
  <rect x="135" y="330" width="110" height="58" class="res"/>
  <text x="150" y="366" class="small">pull-up</text>
  <path d="M190 388 V460" class="wire-3v3"/>
  <circle cx="190" cy="475" r="16" class="terminal"/>
  <text x="220" y="483" class="text">D2</text>
  <circle cx="190" cy="555" r="16" class="terminal"/>
  <text x="220" y="563" class="text">GND</text>

  <rect x="720" y="215" width="360" height="300" class="panel"/>
  <text x="815" y="265" class="label">Bouton</text>
  <circle cx="790" cy="365" r="14" class="terminal"/>
  <circle cx="990" cy="365" r="14" class="terminal"/>
  <path d="M804 365 L930 315" class="switch"/>
  <text x="765" y="405" class="text">COM</text>
  <text x="970" y="405" class="text">NO</text>

  <path d="M206 475 H790" class="wire-signal"/>
  <path d="M206 555 H990 V379" class="wire-gnd"/>
  <text x="375" y="455" class="text" fill="#2563eb">D2 lit HIGH au repos</text>
  <text x="420" y="585" class="text">GND seulement quand appuye</text>

  <rect x="85" y="650" width="1030" height="72" class="note"/>
  <text x="120" y="695" class="text">Dans le code: HIGH = repos, LOW = appui. C'est normal que la logique semble inversee.</text>
</svg>
