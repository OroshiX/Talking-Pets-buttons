<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Etape 4 - Condensateur anti-parasites optionnel</title>
  <desc id="desc">Schema montrant un condensateur 100 nF place en parallele entre D2 et GND.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 3; rx: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 22px Arial, sans-serif; fill: #0f172a; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .wire-signal { stroke: #2563eb; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #111827; stroke-width: 8; fill: none; stroke-linecap: round; }
      .cap { stroke: #7c3aed; stroke-width: 6; stroke-linecap: round; }
      .terminal { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .switch { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; fill: none; }
      .note { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="70" class="label">Etape 4 - 100 nF optionnel</text>
  <text x="60" y="108" class="small">A ajouter seulement si les cables longs provoquent de faux appuis.</text>

  <rect x="70" y="170" width="420" height="360" class="panel"/>
  <text x="115" y="220" class="label">Boite centrale</text>
  <text x="120" y="278" class="text">D2</text>
  <text x="120" y="438" class="text">GND</text>
  <circle cx="220" cy="270" r="14" class="terminal"/>
  <circle cx="220" cy="430" r="14" class="terminal"/>

  <path d="M220 270 H850" class="wire-signal"/>
  <path d="M220 430 H1040 V358" class="wire-gnd"/>

  <path d="M390 270 V330" class="wire-signal"/>
  <path d="M390 370 V430" class="wire-gnd"/>
  <line x1="360" y1="330" x2="420" y2="330" class="cap"/>
  <line x1="360" y1="370" x2="420" y2="370" class="cap"/>
  <text x="430" y="357" class="text" fill="#7c3aed">100 nF</text>
  <text x="335" y="485" class="small">pres du GIGA</text>

  <rect x="760" y="205" width="340" height="260" class="panel"/>
  <text x="850" y="255" class="label">Bouton</text>
  <circle cx="850" cy="350" r="14" class="terminal"/>
  <circle cx="1040" cy="350" r="14" class="terminal"/>
  <path d="M864 350 L980 302" class="switch"/>
  <text x="825" y="392" class="text">COM</text>
  <text x="1020" y="392" class="text">NO</text>

  <rect x="110" y="585" width="980" height="72" class="note"/>
  <text x="145" y="628" class="text">Le condensateur est en parallele entre signal et GND. Il ne remplace pas le bouton.</text>
</svg>
