<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Etape 5 - Audio seul</title>
  <desc id="desc">Schema montrant la cle USB, l'Arduino GIGA et l'enceinte amplifiee branchee en AUX.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 3; rx: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 22px Arial, sans-serif; fill: #0f172a; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .usb { stroke: #7c3aed; stroke-width: 10; fill: none; stroke-linecap: round; }
      .audio { stroke: #16a34a; stroke-width: 10; fill: none; stroke-linecap: round; }
      .power { stroke: #dc2626; stroke-width: 8; fill: none; stroke-linecap: round; }
      .note { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text x="60" y="70" class="label">Etape 5 - Tester l'audio seul</text>
  <text x="60" y="108" class="small">Ici aucun bouton n'est necessaire: on valide stockage WAV + sortie audio.</text>

  <rect x="80" y="240" width="210" height="140" class="box"/>
  <text x="118" y="295" class="label">Cle USB</text>
  <text x="116" y="330" class="small">FAT32</text>
  <text x="110" y="355" class="small">MANGER.WAV</text>

  <rect x="455" y="190" width="300" height="250" class="box"/>
  <text x="505" y="248" class="label">Arduino GIGA</text>
  <text x="510" y="300" class="text">USB-A</text>
  <text x="510" y="345" class="text">jack 3,5 mm</text>
  <text x="510" y="390" class="text">USB-C power</text>

  <rect x="915" y="230" width="220" height="160" class="box"/>
  <text x="948" y="287" class="label">Enceinte</text>
  <text x="955" y="327" class="small">amplifiee</text>
  <text x="955" y="352" class="small">entree AUX</text>

  <path d="M290 310 H455" class="usb"/>
  <text x="325" y="290" class="text" fill="#7c3aed">USB</text>
  <path d="M755 345 H915" class="audio"/>
  <text x="785" y="325" class="text" fill="#16a34a">audio</text>
  <path d="M605 535 V440" class="power"/>
  <text x="630" y="505" class="text" fill="#dc2626">alim USB-C</text>

  <rect x="105" y="505" width="430" height="80" class="note"/>
  <text x="130" y="552" class="text">OK: jack GIGA vers entree AUX amplifiee</text>

  <rect x="670" y="505" width="430" height="80" class="warn"/>
  <text x="695" y="552" class="text">Interdit: haut-parleur nu sur le jack</text>
</svg>
