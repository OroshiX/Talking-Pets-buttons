<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Etape 6 - Un bouton declenche un son</title>
  <desc id="desc">Schema combinant le bouton manger sur D2 et la chaine audio USB vers enceinte.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 3; rx: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 22px Arial, sans-serif; fill: #0f172a; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .wire-signal { stroke: #2563eb; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #111827; stroke-width: 8; fill: none; stroke-linecap: round; }
      .usb { stroke: #7c3aed; stroke-width: 8; fill: none; stroke-linecap: round; }
      .audio { stroke: #16a34a; stroke-width: 8; fill: none; stroke-linecap: round; }
      .power { stroke: #dc2626; stroke-width: 7; fill: none; stroke-linecap: round; }
      .terminal { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .switch { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; fill: none; }
      .flow { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="70" class="label">Etape 6 - Bouton + son</text>
  <text x="60" y="108" class="small">Le bouton choisit le fichier. Le son sort uniquement par la chaine audio.</text>

  <rect x="60" y="215" width="250" height="210" class="box"/>
  <text x="110" y="265" class="label">Bouton</text>
  <text x="112" y="298" class="small">"manger"</text>
  <circle cx="110" cy="345" r="12" class="terminal"/>
  <circle cx="250" cy="345" r="12" class="terminal"/>
  <path d="M122 345 L210 305" class="switch"/>
  <text x="88" y="385" class="text">COM</text>
  <text x="233" y="385" class="text">NO</text>

  <rect x="455" y="180" width="310" height="300" class="box"/>
  <text x="505" y="230" class="label">Arduino GIGA</text>
  <text x="500" y="285" class="text">D2 = MANGER.WAV</text>
  <text x="500" y="330" class="text">GND</text>
  <text x="500" y="375" class="text">USB-A cle WAV</text>
  <text x="500" y="420" class="text">jack audio</text>

  <rect x="900" y="160" width="220" height="120" class="box"/>
  <text x="945" y="212" class="label">Cle USB</text>
  <text x="940" y="245" class="small">MANGER.WAV</text>

  <rect x="900" y="390" width="220" height="130" class="box"/>
  <text x="935" y="445" class="label">Enceinte</text>
  <text x="940" y="480" class="small">amplifiee AUX</text>

  <path d="M110 345 H455" class="wire-signal"/>
  <text x="255" y="325" class="text" fill="#2563eb">signal</text>
  <path d="M250 345 V520 H610 V480" class="wire-gnd"/>
  <text x="370" y="548" class="text">GND</text>
  <path d="M765 375 H900 V220" class="usb"/>
  <text x="805" y="350" class="text" fill="#7c3aed">lecture WAV</text>
  <path d="M765 420 H900 V455" class="audio"/>
  <text x="810" y="450" class="text" fill="#16a34a">audio</text>
  <path d="M610 610 V480" class="power"/>
  <text x="635" y="575" class="small" fill="#dc2626">USB-C power</text>

  <rect x="105" y="625" width="990" height="74" class="flow"/>
  <text x="135" y="670" class="text">Appui -> D2 passe LOW -> le code met MANGER.WAV dans la file -> sortie jack vers enceinte.</text>
</svg>
