<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Etape 10 - Extension a 24 boutons</title>
  <desc id="desc">Vue d'ensemble de 24 boutons passifs branches a une boite centrale Arduino GIGA.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 3; rx: 18; }
      .group { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 21px Arial, sans-serif; fill: #0f172a; }
      .small { font: 17px Arial, sans-serif; fill: #475569; }
      .wire-signal { stroke: #2563eb; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #111827; stroke-width: 5; fill: none; stroke-linecap: round; }
      .audio { stroke: #16a34a; stroke-width: 7; fill: none; stroke-linecap: round; }
      .usb { stroke: #7c3aed; stroke-width: 7; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="60" y="70" class="label">Etape 10 - 24 boutons</text>
  <text x="60" y="108" class="small">Une entree par bouton, un rail GND commun, audio centralise.</text>

  <rect x="60" y="155" width="280" height="520" class="box"/>
  <text x="115" y="205" class="label">Pods passifs</text>

  <rect x="100" y="240" width="190" height="70" class="group"/>
  <text x="135" y="270" class="text">Groupe A</text>
  <text x="125" y="295" class="small">B01..B06</text>
  <rect x="100" y="340" width="190" height="70" class="group"/>
  <text x="135" y="370" class="text">Groupe B</text>
  <text x="125" y="395" class="small">B07..B12</text>
  <rect x="100" y="440" width="190" height="70" class="group"/>
  <text x="135" y="470" class="text">Groupe C</text>
  <text x="125" y="495" class="small">B13..B18</text>
  <rect x="100" y="540" width="190" height="70" class="group"/>
  <text x="135" y="570" class="text">Groupe D</text>
  <text x="125" y="595" class="small">B19..B24</text>

  <rect x="470" y="135" width="360" height="570" class="box"/>
  <text x="535" y="185" class="label">Boite centrale</text>
  <text x="535" y="225" class="small">Arduino GIGA + borniers</text>
  <text x="525" y="285" class="text">D2..D7   groupe A</text>
  <text x="525" y="360" class="text">D8..D13  groupe B</text>
  <text x="525" y="435" class="text">D14..D19 groupe C</text>
  <text x="525" y="510" class="text">D20..D25 groupe D</text>
  <rect x="555" y="575" width="190" height="55" fill="#e5e7eb" stroke="#111827" stroke-width="3" rx="10"/>
  <text x="620" y="610" class="text">Rail GND</text>

  <path d="M290 275 H470" class="wire-signal"/>
  <path d="M290 375 H470" class="wire-signal"/>
  <path d="M290 475 H470" class="wire-signal"/>
  <path d="M290 575 H470" class="wire-signal"/>
  <path d="M310 300 C390 610 460 610 555 610" class="wire-gnd"/>
  <path d="M310 400 C390 625 460 625 555 625" class="wire-gnd"/>
  <path d="M310 500 C390 640 460 640 555 640" class="wire-gnd"/>
  <path d="M310 600 C390 655 460 655 555 655" class="wire-gnd"/>

  <rect x="925" y="220" width="205" height="125" class="box"/>
  <text x="970" y="272" class="label">Cle USB</text>
  <text x="955" y="307" class="small">24 fichiers WAV</text>
  <rect x="925" y="475" width="205" height="125" class="box"/>
  <text x="955" y="527" class="label">Enceinte</text>
  <text x="970" y="562" class="small">AUX amplifiee</text>

  <path d="M830 282 H925" class="usb"/>
  <path d="M830 537 H925" class="audio"/>

  <text x="70" y="735" class="text">Conseil: cabler et tester par groupes de 6. Etiqueter B01..B24 des le debut.</text>
</svg>
