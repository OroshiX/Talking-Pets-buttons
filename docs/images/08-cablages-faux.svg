<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cablages a ne pas faire</title>
  <desc id="desc">Trois schemas montrant les erreurs a eviter: 5V vers entree, haut-parleur passif sur jack, et COM plus NC.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .bad { fill: #fff1f2; stroke: #dc2626; stroke-width: 3; rx: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 22px Arial, sans-serif; fill: #0f172a; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .wire-red { stroke: #dc2626; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wire-dark { stroke: #111827; stroke-width: 7; fill: none; stroke-linecap: round; }
      .cross { stroke: #dc2626; stroke-width: 14; stroke-linecap: round; }
      .switch { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; fill: none; }
      .terminal { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="60" y="70" class="label">Cablages a ne pas faire</text>
  <text x="60" y="108" class="small">Ces erreurs peuvent abimer le GIGA ou faire declencher les boutons a l'envers.</text>

  <rect x="70" y="160" width="330" height="520" class="bad"/>
  <text x="110" y="215" class="label">Erreur 1</text>
  <text x="105" y="260" class="text">5V vers entree</text>
  <path d="M130 355 H330" class="wire-red"/>
  <text x="120" y="335" class="text">5V</text>
  <text x="300" y="335" class="text">D2</text>
  <line x1="145" y1="430" x2="330" y2="570" class="cross"/>
  <line x1="330" y1="430" x2="145" y2="570" class="cross"/>
  <text x="110" y="625" class="small">Le GIGA est en logique 3,3 V.</text>

  <rect x="435" y="160" width="330" height="520" class="bad"/>
  <text x="475" y="215" class="label">Erreur 2</text>
  <text x="470" y="260" class="text">HP nu sur jack</text>
  <path d="M500 355 H700" class="wire-dark"/>
  <text x="490" y="335" class="text">jack</text>
  <circle cx="690" cy="355" r="45" fill="#ffffff" stroke="#111827" stroke-width="5"/>
  <path d="M670 355 H710" class="wire-dark"/>
  <line x1="510" y1="430" x2="695" y2="570" class="cross"/>
  <line x1="695" y1="430" x2="510" y2="570" class="cross"/>
  <text x="475" y="625" class="small">Il faut une enceinte amplifiee.</text>

  <rect x="800" y="160" width="330" height="520" class="bad"/>
  <text x="840" y="215" class="label">Erreur 3</text>
  <text x="835" y="260" class="text">COM + NC</text>
  <circle cx="875" cy="355" r="12" class="terminal"/>
  <circle cx="1020" cy="355" r="12" class="terminal"/>
  <path d="M887 355 H1008" class="switch"/>
  <text x="852" y="395" class="text">COM</text>
  <text x="1000" y="395" class="text">NC</text>
  <line x1="865" y1="430" x2="1050" y2="570" class="cross"/>
  <line x1="1050" y1="430" x2="865" y2="570" class="cross"/>
  <text x="835" y="625" class="small">Le repos serait lu comme appui.</text>
</svg>
