<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Coupe du support imprimé</title>
  <desc id="desc">Un bouton repose sur de petites protubérances intérieures suspendues dans un support cylindrique avec évents latéraux.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d50"/>
    </marker>
    <marker id="brown-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4e39"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#f7f4ef"/>
  <text x="450" y="86" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#26312d">Support 3D: cylindre creux avec protubérance intérieure</text>

  <rect x="150" y="360" width="600" height="48" rx="4" fill="#d9e8df" stroke="#5b7d6e" stroke-width="3"/>
  <text x="450" y="391" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#26312d">tapis de yoga</text>

  <g fill="#fff1cf" stroke="#7a6b58" stroke-width="4">
    <rect x="188" y="235" width="70" height="115"/>
    <rect x="642" y="235" width="70" height="115"/>
    <rect x="258" y="273" width="58" height="16"/>
    <rect x="584" y="273" width="58" height="16"/>
  </g>

  <rect x="188" y="310" width="70" height="22" fill="#f7f4ef"/>
  <rect x="642" y="310" width="70" height="22" fill="#f7f4ef"/>

  <rect x="260" y="150" width="380" height="123" rx="20" fill="#fdfdfd" stroke="#26312d" stroke-width="4"/>
  <text x="450" y="214" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#26312d">bouton enregistrable</text>
  <path d="M 315 273 L 315 280" stroke="#8b4e39" stroke-width="6"/>
  <path d="M 585 273 L 585 280" stroke="#8b4e39" stroke-width="6"/>

  <text x="450" y="304" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#8b4e39">chambre d'air ouverte</text>
  <text x="450" y="256" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#8b4e39">petite protubérance intérieure</text>
  <path d="M 384 261 L 300 273" stroke="#8b4e39" stroke-width="2.5" marker-end="url(#brown-arrow)"/>
  <path d="M 516 261 L 600 273" stroke="#8b4e39" stroke-width="2.5" marker-end="url(#brown-arrow)"/>

  <path d="M 450 321 L 258 321 L 150 321" stroke="#2f5d50" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450 321 L 642 321 L 750 321" stroke="#2f5d50" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="118" y="327" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="#2f5d50">évent</text>
  <text x="782" y="327" font-family="Arial, sans-serif" font-size="16" fill="#2f5d50">évent vers micro</text>
</svg>
